<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit Contact</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
  <h2 class="text-center">Edit Contact</h2>
  <form th:action="@{/contacts/update}" method="get" th:object="${contact}" class="mx-auto" style="max-width: 500px;">
    <input type="hidden" th:field="*{id}" />
    <div class="mb-3">
      <label class="form-label">Name:</label>
      <input type="text" th:field="*{name}" class="form-control" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Email:</label>
      <input type="email" th:field="*{email}" class="form-control" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Phone:</label>
      <input type="text" th:field="*{phone}" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary w-100">Update Contact</button>
  </form>
</div>
</body>
</html>
