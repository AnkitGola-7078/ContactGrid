<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Contacts</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h2 class="text-center">Contact List</h2>

    <table class="table table-bordered table-striped mt-3">
        <thead class="table-primary">
        <tr>
            <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th style="width: 160px;">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${contacts}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.name}"></td>
            <td th:text="${c.email}"></td>
            <td th:text="${c.phone}"></td>
            <td>
                <div class="d-flex">
                    <!-- Edit Button -->
                    <form th:action="@{/contacts/edit}" method="post" class="me-2">
                        <input type="hidden" name="id" th:value="${c.id}" />
                        <button type="submit" class="btn btn-sm btn-warning">Edit</button>
                    </form>

                    <!-- Delete Button -->
                    <form th:action="@{/contacts/delete}" method="post"
                          onsubmit="return confirm('Are you sure you want to delete this contact?');">
                        <input type="hidden" name="id" th:value="${c.id}" />
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
